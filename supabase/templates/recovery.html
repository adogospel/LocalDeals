<!doctype html>
<html lang="fr">

      <tr><td align="center" style="padding:40px 16px">
        <table role="presentation" width="100%" style="max-width:520px;background:#ffffff;border:1px solid #e7e9ee;border-radius:24px">
          <tr><td style="padding:36px">

            <p style="font-size:15px;line-height:1.6;color:#667085">Utilisez ce code dans l’application pour continuer :</p>
            <div style="margin:28px 0;padding:18px;text-align:center;border-radius:16px;background:#fff0e7;font-size:30px;font-weight:700;letter-spacing:8px;color:#cf4c0b">{{ .Token }}</div>
            <p style="font-size:13px;line-height:1.6;color:#98a2b3">Ne partagez jamais ce code. Si vous n’avez pas demandé cette réinitialisation, votre mot de passe reste inchangé.</p>
          </td></tr>
